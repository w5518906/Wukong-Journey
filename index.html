<style>
:root{--gold:#ffd36b;--glass:rgba(7,18,35,.68);--line:rgba(255,224,160,.28)}

kbd{border:1px solid #ffffff55;background:#ffffff18;border-radius:5px;padding:2px 6px;color:#ffe2a1}

.eyebrow{letter-spacing:5px;color:#ffd783;font-size:11px;font-weight:900}.modal h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,58px);line-height:1.05;margin:14px 0;color:#ffe3a0;text-shadow:0 5px 24px #ff9f3366}.modal p{color:#c5d5e5;line-height:1.8}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

button.secondary{color:#f7e6c4;background:#ffffff12;border-color:#ffffff44;box-shadow:none}

@media(max-width:650px){#hud{padding:9px}.panel{padding:8px 9px}.left{width:45vw}.right{min-width:105px}.big{font-size:20px}#mission{top:auto;bottom:126px;font-size:11px}#bottom{display:none}#touch{display:flex}.statline{font-size:11px}}
</style>
</head>
<body>
<div id="hud">
 <div class="panel left"><div class="brand">✦ 天命 · 大圣 ✦</div><div class="statline"><span>生命</span><b id="hpText">100 / 100</b></div><div class="bar"><div id="hpBar" class="fill hp"></div></div><div class="statline"><span>真气</span><b id="energyText">100%</b></div><div class="bar"><div id="energyBar" class="fill energy"></div></div><div class="statline"><span>关卡</span><b id="level">第一回 · 东海</b></div></div>
 <div class="panel right"><div class="brand">JOURNEY RECORD</div><div class="big" id="coins">0</div><div class="small">灵石</div><div class="statline"><span>航程</span><b id="distance">0 m</b></div><div class="statline"><span>妖魔</span><b id="kills">0</b></div></div>
</div>

<div id="bossHud"><div class="statline"><span id="bossName">东海龙王先锋</span><span id="bossHpText">100%</span></div><div class="bar"><div id="bossBar" class="fill boss"></div></div></div>

<div id="overlay"><div class="modal"><div class="eyebrow">A LEGEND REBORN · VERSION 6.0</div><h1>齐天大圣<br>踏浪西游</h1><p>东海龙宫妖气冲天，灵石散落海面。<br>执金箍棒、踏筋斗云，闯过妖潮，迎战龙王！</p><p style="font-size:12px">A / D 移动　J 攻击　K 闪避　Q 神通　P 暂停</p><div class="actions"><button id="start">踏浪出征</button><button class="secondary" id="quality">画质：电影</button></div><p class="small">建议使用桌面 Chrome / Edge；首次加载需要联网获取 Three.js。</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bb9c8);scene.fog=new THREE.FogExp2(0x9bbdca,.009);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,260);camera.position.set(0,8,15);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9edff,0x23364d,2.0));
const sun=new THREE.DirectionalLight(0xffe0ad,3.1);sun.position.set(-12,20,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
const fill=new THREE.DirectionalLight(0x55aaff,1.1);fill.position.set(12,8,-15);scene.add(fill);
const mat=(c,metal=0,rough=.55)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
const gold=mat(0xd89a35,.78,.24),goldLight=mat(0xffd66b,.72,.2),red=mat(0x9d2027,.25,.42),dark=mat(0x18283b,.35,.48),skin=mat(0xb96e3c,.12,.65),wood=mat(0x54321f,.15,.65);
const sphere=new THREE.SphereGeometry(1,24,16);
function mesh(g,m,parent,x=0,y=0,z=0,sx=1,sy=1,sz=1){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(rt,rb,h,m,p,x,y,z,seg=16){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m,p,x,y,z)}
// Animated procedural ocean shader
const oceanGeo=new THREE.PlaneGeometry(220,260,110,130);oceanGeo.rotateX(-Math.PI/2);
const oceanMat=new THREE.MeshPhysicalMaterial({color:0x087d9c,metalness:.28,roughness:.24,clearcoat:1,clearcoatRoughness:.12,transparent:false});
const ocean=mesh(oceanGeo,oceanMat,scene,0,-.5,-80);ocean.receiveShadow=true;
const pos=oceanGeo.attributes.position;const base=Float32Array.from(pos.array);
const waveGeo=new THREE.PlaneGeometry(220,260,75,90);waveGeo.rotateX(-Math.PI/2);
const waveMat=new THREE.MeshBasicMaterial({color:0x73d5df,transparent:true,opacity:.12,wireframe:true});
const wave=mesh(waveGeo,waveMat,scene,0,-.43,-80);const wpos=waveGeo.attributes.position;const wbase=Float32Array.from(wpos.array);
const horizon=new THREE.Group();scene.add(horizon);
function island(x,z,scale){const g=new THREE.Group();horizon.add(g);g.position.set(x,-.2,z);mesh(new THREE.ConeGeometry(5*scale,9*scale,7),mat(0x344d45),g,0,3.5*scale,0,1,1,1);mesh(new THREE.ConeGeometry(3.2*scale,5*scale,7),mat(0x526b55),g,0,6*scale,0);for(let i=0;i<5;i++){const t=new THREE.Group();g.add(t);t.position.set((Math.random()-.5)*5*scale,Math.random()*3*scale,(Math.random()-.5)*5*scale);cylinder(.12*scale,.25*scale,1.5*scale,wood,t,0,.5*scale,0);mesh(new THREE.SphereGeometry(1.2*scale,8,7),mat(0x28634f),t,0,1.7*scale,0,1,.8,1);}return g}
for(let i=0;i<10;i++){island((i%2?1:-1)*(18+Math.random()*24),-25-i*24,.7+Math.random()*.7)}
// Sun glow
const sunBall=mesh(new THREE.SphereGeometry(5,24,16),new THREE.MeshBasicMaterial({color:0xffdca0}),scene,-22,18,-145); 
// Player boat and Wukong
const player=new THREE.Group();scene.add(player);player.position.set(0,0,5);
const boat=new THREE.Group();player.add(boat);
mesh(new THREE.CapsuleGeometry(.72,.8,5,12),wood,boat,0,.1,0,1,.45,2.4);
mesh(new THREE.BoxGeometry(1.35,.24,4.2),mat(0x7b4727),boat,0,.18,0);
for(let i=-1;i<=1;i++){mesh(new THREE.BoxGeometry(.08,.38,3.8),gold,boat,i*.58,.34,0)}
// Wukong body
const hero=new THREE.Group();boat.add(hero);hero.position.set(0,.55,-.15);
mesh(new THREE.CylinderGeometry(.28,.38,.95,12),red,hero,0,.95,0);
mesh(sphere,skin,hero,0,1.72,0,.42,.48,.4);
mesh(sphere,mat(0xe9b66f),hero,0,1.78,-.03,.44,.5,.42);
mesh(sphere,skin,hero,-.34,1.7,0,.16,.18,.15);mesh(sphere,skin,hero,.34,1.7,0,.16,.18,.15);
mesh(sphere,mat(0x21180f),hero,-.15,1.82,-.36,.06,.07,.035);mesh(sphere,mat(0x21180f),hero,.15,1.82,-.36,.06,.07,.035);
mesh(new THREE.TorusGeometry(.42,.07,8,24),goldLight,hero,0,2.1,0).rotation.x=Math.PI/2;
for(let s of [-1,1]){mesh(new THREE.ConeGeometry(.13,.48,8),mat(0xd8a15d),hero,s*.31,2.04,.05,s,1,1);mesh(new THREE.SphereGeometry(.13,10,8),mat(0x8c342a),hero,s*.31,2.25,.05)}
mesh(new THREE.ConeGeometry(.65,.8,10),red,hero,0,1.2,.2,1,1,.6);
const staff=new THREE.Group();hero.add(staff);staff.position.set(.8,1.2,.1);staff.rotation.z=-.2;
cylinder(.075,.075,3.2,mat(0x8a451d,.6,.25),staff,0,0,0);cylinder(.12,.12,.24,goldLight,staff,0,1.55,0);cylinder(.12,.12,.24,goldLight,staff,0,-1.55,0);
const cloud=mesh(new THREE.SphereGeometry(.8,16,10),new THREE.MeshBasicMaterial({color:0xffd66b,transparent:true,opacity:.22}),player,0,.25,.3,1.5,.18,2.4);
// VFX groups
const effects=new THREE.Group();scene.add(effects);
function burst(x,y,z,color=0xffd36b,count=18){for(let i=0;i<count;i++){const p=mesh(new THREE.SphereGeometry(.07+Math.random()*.08,6,5),new THREE.MeshBasicMaterial({color,transparent:true}),effects,x,y,z);p.userData={vx:(Math.random()-.5)*5,vy:Math.random()*4,vz:(Math.random()-.5)*5,life:.65+Math.random()*.5};}}
const enemies=[],coins=[],projectiles=[];
function makeEnemy(x,z,boss=false){const g=new THREE.Group();scene.add(g);g.position.set(x,.0,z);const bodymat=boss?mat(0x31536a,.5,.3):mat(0x39505c,.3,.5);mesh(new THREE.ConeGeometry(boss?1.35:.65,boss?2.8:1.4,8),bodymat,g,0,boss?1.5:.75,0,1,1,1);mesh(sphere,mat(0x8b3b34),g,0,boss?2.9:1.5,-.02,boss?1:.48,boss?1:.48,boss?1:.48);for(let s of [-1,1])mesh(new THREE.ConeGeometry(.18,.65,7),gold,g,s*(boss?1:.42),boss?3.25:1.95,0,s,1,1);const eyeMat=new THREE.MeshBasicMaterial({color:0xff4c2f});mesh(sphere,eyeMat,g,-.18,boss?2.95:1.55,-.42,.08,.08,.05);mesh(sphere,eyeMat,g,.18,boss?2.95:1.55,-.42,.08,.08,.05);g.userData={boss,hp:boss?18:3,max:boss?18:3,hit:0,attack:2+Math.random()*2};enemies.push(g);return g}
function addCoin(x,z){const c=mesh(new THREE.TorusGeometry(.32,.09,8,18),goldLight,scene,x,.75,z);c.userData={spin:Math.random()*6};coins.push(c)}
const keys={};let running=false,paused=false,gameOver=false,quality=2,hp=100,energy=100,coinCount=0,kills=0,distance=0,worldSpeed=12,elapsed=0,attackCd=0,dodgeCd=0,ultCd=0,spawnT=0,bossSpawned=false,boss=null,invuln=0,camMode=0;
const clock=new THREE.Clock();
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity=0,950)}
function updateHud(){ $('hpText').textContent=Math.ceil(hp)+' / 100';$('hpBar').style.width=hp+'%';$('energyText').textContent=Math.ceil(energy)+'%';$('energyBar').style.width=energy+'%';$('coins').textContent=coinCount;$('distance').textContent=Math.floor(distance)+' m';$('kills').textContent=kills;$('level').textContent=distance<500?'第一回 · 东海':distance<1100?'第二回 · 海妖阵':'第三回 · 龙宫门前';}
function damage(n){if(invuln>0)return;hp=Math.max(0,hp-n);invuln=.8;burst(player.position.x,.8,player.position.z,0xff563d,12);toast('受到攻击 −'+n);if(hp<=0)endGame();updateHud()}
function attack(){if(!running||paused||attackCd>0)return;attackCd=.42;staff.rotation.z=-1.5;setTimeout(()=>staff.rotation.z=-.2,160);burst(player.position.x,.9,player.position.z-2,0xffd36b,8);let hit=false;for(const e of enemies){if(Math.abs(e.position.z-player.position.z)<7&&Math.abs(e.position.x-player.position.x)<4){e.userData.hp-=2;e.userData.hit=.2;burst(e.position.x,1,e.position.z,0xffb34c,12);hit=true;if(e.userData.hp<=0)killEnemy(e)}}if(hit)toast('金箍棒 · 破！')}
function killEnemy(e){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);scene.remove(e);kills++;coinCount+=e.userData.boss?80:15;energy=Math.min(100,energy+12);burst(e.position.x,1,e.position.z,0x69d9ff,30);if(e.userData.boss){boss=null;$('bossHud').style.display='none';hp=Math.min(100,hp+30);toast('龙王先锋已败！生命恢复');}updateHud()}
function dodge(){if(!running||paused||dodgeCd>0||energy<18)return;dodgeCd=2.4;energy-=18;invuln=.7;player.userData.dodge=.38;toast('筋斗云 · 闪！');burst(player.position.x,.4,player.position.z,0x91e9ff,24)}
function ultimate(){if(!running||paused||ultCd>0||energy<45)return;energy-=45;ultCd=7;toast('如意神通 · 乾坤一棒！');burst(player.position.x,1,player.position.z-3,0xffe27a,65);for(const e of [...enemies]){if(Math.abs(e.position.z-player.position.z)<24){e.userData.hp-=12;if(e.userData.hp<=0)killEnemy(e)}}}
function spawnBoss(){boss=makeEnemy(0,-47,true);$('bossHud').style.display='block';$('bossName').textContent='东海龙王先锋';toast('⚠ 妖王现身！')}
function endGame(){running=false;gameOver=true;$('overlay').style.display='grid';$('overlay').querySelector('.eyebrow').textContent='JOURNEY ENDED';$('overlay').querySelector('h1').innerHTML='大圣暂歇<br>再战东海';$('overlay').querySelector('p').innerHTML=`航程 ${Math.floor(distance)} 米 · 击败妖魔 ${kills} · 收集灵石 ${coinCount}`;$('start').textContent='再战一回';}
function startGame(){hp=100;energy=100;coinCount=0;kills=0;distance=0;elapsed=0;spawnT=0;bossSpawned=false;boss=null;gameOver=false;paused=false;running=true;for(const e of [...enemies])scene.remove(e);enemies.length=0;for(const c of [...coins])scene.remove(c);coins.length=0;$('bossHud').style.display='none';$('overlay').style.display='none';$('overlay').querySelector('.eyebrow').textContent='A LEGEND REBORN · VERSION 6.0';$('overlay').querySelector('h1').innerHTML='齐天大圣<br>踏浪西游';$('start').textContent='踏浪出征';updateHud();clock.getDelta()}
function togglePause(){if(!running)return;paused=!paused;if(paused){$('overlay').style.display='grid';$('overlay').querySelector('.eyebrow').textContent='PAUSED';$('overlay').querySelector('h1').innerHTML='暂歇片刻';$('overlay').querySelector('p').textContent='大圣整顿行装，稍后继续踏浪。';$('start').textContent='继续征途';}else $('overlay').style.display='none'}
$('start').onclick=()=>{if(paused&&!gameOver){paused=false;$('overlay').style.display='none';return}startGame()};
$('quality').onclick=()=>{quality=(quality+1)%3;const names=['画质：性能','画质：均衡','画质：电影'];$('quality').textContent=names[quality];renderer.setPixelRatio(Math.min(devicePixelRatio,quality===0?1:quality===1?1.35:1.8));sun.castShadow=quality===2};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='j'||k===' ')attack();if(k==='k')dodge();if(k==='q')ultimate();if(k==='p'||k==='escape')togglePause();if(k==='c'){camMode=1-camMode;toast(camMode?'追逐视角':'电影视角')}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.touchbtn').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(k==='j')attack();if(k==='k')dodge();if(k==='q')ultimate()});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let lastHud=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
// animate ocean geometry
for(let i=0;i<pos.count;i++){const x=base[i*3],z=base[i*3+2];pos.setY(i,base[i*3+1]+Math.sin(x*.13+elapsed*1.5)*.28+Math.cos(z*.12+elapsed*1.1)*.2)}pos.needsUpdate=true;oceanGeo.computeVertexNormals();
for(let i=0;i<wpos.count;i++){const x=wbase[i*3],z=wbase[i*3+2];wpos.setY(i,wbase[i*3+1]+Math.sin(x*.16+elapsed*1.8)*.35+Math.cos(z*.15+elapsed*1.4)*.25)}wpos.needsUpdate=true;
if(running&&!paused&&!gameOver){const speed=worldSpeed+(distance>500?2:0);distance+=speed*dt;energy=Math.min(100,energy+4*dt);attackCd=Math.max(0,attackCd-dt);dodgeCd=Math.max(0,dodgeCd-dt);ultCd=Math.max(0,ultCd-dt);invuln=Math.max(0,invuln-dt);
let dx=0;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*9*dt,-7.5,7.5);player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-dx*.16,7,dt);player.position.y=.05+Math.sin(elapsed*3)*.08;
if(player.userData.dodge>0){player.userData.dodge-=dt;player.position.x=THREE.MathUtils.clamp(player.position.x+(dx||1)*14*dt,-8,8)}
hero.rotation.y=Math.sin(elapsed*2)*.07;staff.rotation.z=THREE.MathUtils.damp(staff.rotation.z,-.2,8,dt);hero.position.y=.55+Math.sin(elapsed*4)*.04;
spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.65,1.7-distance/1500);const x=(Math.random()-.5)*13;makeEnemy(x,-48-Math.random()*12,false);if(Math.random()<.65)addCoin((Math.random()-.5)*13,-28-Math.random()*20)}
if(distance>650&&!bossSpawned){bossSpawned=true;spawnBoss()}
for(const e of [...enemies]){e.position.z+=speed*dt*.95;e.rotation.y+=dt*.5;e.position.y=Math.sin(elapsed*3+e.position.x)*.08;if(e.userData.hit>0)e.userData.hit-=dt;if(e.userData.boss){$('bossBar').style.width=(e.userData.hp/e.userData.max*100)+'%';$('bossHpText').textContent=Math.ceil(e.userData.hp/e.userData.max*100)+'%'}if(Math.abs(e.position.z-player.position.z)<1.8&&Math.abs(e.position.x-player.position.x)<1.8){damage(e.userData.boss?22:12);e.position.z=12;if(!e.userData.boss)killEnemy(e)}if(e.position.z>13){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);scene.remove(e)}}
for(const c of [...coins]){c.position.z+=speed*dt;c.rotation.y+=dt*3;c.position.y=.75+Math.sin(elapsed*4+c.userData.spin)*.18;if(Math.abs(c.position.z-player.position.z)<1.6&&Math.abs(c.position.x-player.position.x)<1.6){coinCount+=10;energy=Math.min(100,energy+4);burst(c.position.x,.8,c.position.z,0xffd65e,9);scene.remove(c);coins.splice(coins.indexOf(c),1)}else if(c.position.z>12){scene.remove(c);coins.splice(coins.indexOf(c),1)}}
for(const e of [...effects.children]){const u=e.userData;if(u.life){u.life-=dt;e.position.x+=u.vx*dt;e.position.y+=u.vy*dt;e.position.z+=u.vz*dt;u.vy-=7*dt;e.material.opacity=Math.max(0,u.life);if(u.life<=0){effects.remove(e);e.geometry.dispose();e.material.dispose()}}}
const target=new THREE.Vector3(player.position.x*.35,camMode?5.2:7.2,camMode?12:16);camera.position.lerp(target,1-Math.exp(-3*dt));camera.lookAt(player.position.x*.18,1,-13);
if(elapsed-lastHud>.12){updateHud();lastHud=elapsed}
}else{camera.lookAt(0,1,-13);for(const e of effects.children){if(e.userData.life){e.userData.life-=dt;if(e.userData.life<=0)effects.remove(e)}}}
horizon.children.forEach((g,i)=>{g.position.z+=running&&!paused?worldSpeed*dt*.15:0;if(g.position.z>15)g.position.z=-250});
renderer.render(scene,camera)}
animate();
